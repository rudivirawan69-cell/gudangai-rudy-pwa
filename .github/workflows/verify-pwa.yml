name: Verify GudangAI PWA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/beranda-po-3d-cloudflare-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Agent Worker syntax and Wrangler AI binding
        run: |
          node --check worker.js
          node --input-type=module -e "import fs from 'node:fs'; const raw=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\\s*\\/\\/.*\\n/, ''); const c=JSON.parse(raw); if(c.name !== 'gudangai-rudy') throw new Error('Unexpected Worker name: '+c.name); if(c.ai?.binding !== 'AI') throw new Error('AI binding must be AI'); if(c.vars?.ANTHROPIC_FALLBACK_ENABLED !== 'false') throw new Error('Anthropic fallback must remain disabled');"
      - name: Test Agent Hybrid routing and safety
        run: npm run test:agent
      - name: Validate Apps Script candidate syntax
        run: cp audit-apps-script/Code_GudangAI_V6.6.5_RELEASE_CANDIDATE.gs /tmp/Code_GudangAI_candidate.js && node --check /tmp/Code_GudangAI_candidate.js
      - name: Validate combined production-fix Code.gs syntax
        run: cp audit-apps-script/Code_GudangAI_V6.6.5_COMBINED_PRODUCTION_FIXES.gs /tmp/Code_GudangAI_combined.js && node --check /tmp/Code_GudangAI_combined.js
      - name: Validate root Apps Script backend syntax
        run: node --check < Code.gs
      - name: Test combined Code.gs production contracts
        run: node scripts/test-combined-codegs.mjs
      - name: Test PDF precision and manual stock sync contracts
        run: node scripts/test-recovery-contracts.mjs
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Smoke test all PWA pages and responsive widths
        run: node scripts/smoke-pwa-pages.mjs

      - name: Upload Phase 3 visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gudangai-visual-phase3
          path: artifacts/visual-phase3/
          if-no-files-found: warn
          retention-days: 14
