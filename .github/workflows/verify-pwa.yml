name: Verify GudangAI PWA

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/beranda-po-3d-cloudflare-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
