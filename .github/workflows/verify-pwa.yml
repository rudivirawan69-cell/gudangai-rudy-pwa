name: Verify GudangAI PWA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/beranda-po-3d-cloudflare-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Apps Script candidate syntax
        run: cp audit-apps-script/Code_GudangAI_V6.6.5_RELEASE_CANDIDATE.gs /tmp/Code_GudangAI_candidate.js && node --check /tmp/Code_GudangAI_candidate.js
      - name: Validate combined production-fix Code.gs syntax
        run: cp audit-apps-script/Code_GudangAI_V6.6.5_COMBINED_PRODUCTION_FIXES.gs /tmp/Code_GudangAI_combined.js && node --check /tmp/Code_GudangAI_combined.js
      - name: Validate root Apps Script backend syntax
        run: node --check < Code.gs
      - name: Test combined Code.gs production contracts
        run: node scripts/test-combined-codegs.mjs
      - name: Test PDF precision and manual stock sync contracts
        run: node scripts/test-recovery-contracts.mjs
      - name: Validate dual-agent Workers and Wrangler bindings
        run: |
          node --check worker.js
          node --check cloudflare/gateway-worker.js
          node -e "const fs=require('node:fs'); const g=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const p=JSON.parse(fs.readFileSync('wrangler.proxy.jsonc','utf8')); if(g.name!=='gudangai-rudy-pwa69'||g.ai?.binding!=='AI'||g.services?.[0]?.binding!=='CLAUDE_PROXY'||g.services?.[0]?.service!=='claude-proxy') process.exit(1); if(p.name!=='claude-proxy'||p.ai?.binding!=='AI'||p.vars?.ANTHROPIC_FALLBACK_ENABLED!=='false') process.exit(1); console.log('Gateway, Service Binding and opt-in-only Anthropic config verified.')"
      - name: Test Agent Hybrid routing and safety
        run: npm run test:agent
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Smoke test all PWA pages and responsive widths
        run: node scripts/smoke-pwa-pages.mjs
