name: GudangAI RUDY CI and Cloudflare Production Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gudangai-cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Worker syntax and canonical Wrangler target
        run: |
          node --check worker.js
          node --input-type=module -e "import fs from 'node:fs'; const raw=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\\s*\\/\\/.*$/gm, ''); const c=JSON.parse(raw); if(c.name !== 'gudangai-rudy-pwa-69') throw new Error('Unexpected Worker name: '+c.name); if(c.main !== 'worker.js') throw new Error('Unexpected Worker entrypoint: '+c.main); if(c.assets?.directory !== './dist') throw new Error('Unexpected assets directory'); if(c.vars?.ALLOWED_ORIGINS !== 'https://gudangai-rudy-pwa-69.rudivirawan69.workers.dev') throw new Error('Unexpected production origin'); if(c.vars?.ANTHROPIC_FALLBACK_ENABLED !== 'false') throw new Error('Anthropic fallback must remain disabled');"
      - name: Test Agent Worker security and routing
        run: npm run test:agent
      - name: Build verification
        run: npm run build

  deploy:
    name: Deploy canonical Cloudflare Worker
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate required production secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          GUDANGAI_SHEETS_API_SECRET: ${{ secrets.GUDANGAI_SHEETS_API_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${SUPABASE_URL:-}" ] && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ] && missing+=("SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY)")
          [ -z "${GUDANGAI_SHEETS_API_SECRET:-}" ] && missing+=("GUDANGAI_SHEETS_API_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub Environment secrets (production): ${missing[*]}"
            echo "Configure them under Settings > Environments > production > Environment secrets."
            exit 1
          fi
          echo "Required production secrets are present."

      - name: Build PWA for canonical Worker origin
        run: npm run build
        env:
          CLOUDFLARE_WORKERS: "true"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_GUDANGAI_AI_API_BASE: "https://gudangai-rudy-pwa-69.rudivirawan69.workers.dev"

      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.156.0 deploy --config wrangler.jsonc --dry-run

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4.156.0 deploy --config wrangler.jsonc

      - name: Apply encrypted runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          GUDANGAI_SHEETS_API_SECRET: ${{ secrets.GUDANGAI_SHEETS_API_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Refusing to set empty secret: $name"
              exit 1
            fi
            printf '%s' "$value" | npx wrangler@4.156.0 secret put "$name" --config wrangler.jsonc
          }
          put_secret "SUPABASE_URL" "$SUPABASE_URL"
          put_secret "SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY"
          put_secret "GUDANGAI_SHEETS_API_SECRET" "$GUDANGAI_SHEETS_API_SECRET"


      - name: Verify live Worker health and Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gudangai-rudy-pwa-69.rudivirawan69.workers.dev"
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$URL/api/agent/health")"
          node -e 'const d=JSON.parse(process.argv[1]); if(d.success !== true) throw new Error("Worker health did not return success"); if(d.deploymentTarget !== "https://gudangai-rudy-pwa-69.rudivirawan69.workers.dev") throw new Error("Unexpected deployment target: "+d.deploymentTarget); if(d.authConfigured !== true) throw new Error("Supabase Auth runtime configuration is missing"); console.log("Live Worker health OK; Supabase Auth configured; target:", d.deploymentTarget);' "$response"
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS --header "Origin: $URL" --header "Access-Control-Request-Method: POST" "$URL/api/agent")"
          printf '%s' "$headers" | grep -qi "access-control-allow-origin: $URL"
          echo "Worker CORS preflight OK for canonical production origin."

      - name: Confirm production deployment target
        run: |
          echo "Deployment commit: ${GITHUB_SHA}"
          echo "Worker: gudangai-rudy-pwa-69"
          echo "Production URL: https://gudangai-rudy-pwa-69.rudivirawan69.workers.dev/"
