name: Deploy GudangAI dual-agent Workers to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dual-agent-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, verify and deploy proxy then PWA gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test gateway contract
        run: node --test scripts/test-gateway-worker.mjs

      - name: Test proxy Agent security and provider routing
        run: npm run test:agent

      - name: Check Worker syntax
        run: |
          node --check cloudflare/gateway-worker.js
          node --check worker.js

      - name: Build PWA assets
        run: npm run build
        env:
          CLOUDFLARE_WORKERS: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Validate deployment credentials and public PWA auth config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required deployment configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deployment stopped before touching either Worker."
            exit 1
          fi

      - name: Validate proxy Worker configuration
        run: npx wrangler@4.156.0 deploy --config wrangler.proxy.jsonc --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate PWA gateway and Service Binding configuration
        run: npx wrangler@4.156.0 deploy --config wrangler.jsonc --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Supabase verification secrets on proxy
        shell: bash
        run: |
          printf '%s' "$SUPABASE_URL" | npx wrangler@4.156.0 secret put SUPABASE_URL --config wrangler.proxy.jsonc
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler@4.156.0 secret put SUPABASE_ANON_KEY --config wrangler.proxy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Configure Supabase verification secrets on PWA gateway
        shell: bash
        run: |
          printf '%s' "$SUPABASE_URL" | npx wrangler@4.156.0 secret put SUPABASE_URL --config wrangler.jsonc
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler@4.156.0 secret put SUPABASE_ANON_KEY --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy Claude proxy first
        run: npx wrangler@4.156.0 deploy --config wrangler.proxy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy PWA gateway with Service Binding
        run: npx wrangler@4.156.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deployment targets
        run: |
          echo "Proxy Worker: https://claude-proxy.rudivirawan69.workers.dev/"
          echo "PWA gateway: https://gudangai-rudy-pwa69.rudivirawan69.workers.dev/"
          echo "Workers AI is primary. Anthropic fallback remains disabled by default."
          echo "Deployment commit: ${GITHUB_SHA}"
