name: Deploy GudangAI RUDY PWA to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feature/worker-ai-cost-safe-hardening-20261104
      - fix/worker-auth-stability-20261110
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test Agent Worker security and provider routing
        run: npm run test:agent

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Build production PWA
        run: npm run build
        env:
          CLOUDFLARE_WORKERS: "true"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_GUDANGAI_AI_API_BASE: "https://gudangai-rudy-live69.rudivirawan69.workers.dev"

      - name: Validate Cloudflare secrets presence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GUDANGAI_SHEETS_API_SECRET: ${{ secrets.GUDANGAI_SHEETS_API_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${SUPABASE_URL:-}" ] && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_ANON_KEY:-}" ] && missing+=("SUPABASE_ANON_KEY")
          [ -z "${GUDANGAI_SHEETS_API_SECRET:-}" ] && missing+=("GUDANGAI_SHEETS_API_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub Environment secrets (production): ${missing[*]}"
            echo "Set them under Settings → Environments → production → Environment secrets."
            exit 1
          fi
          echo "All required secrets are present in the GitHub Environment."

      - name: Validate Cloudflare Worker config (dry-run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4.156.0 deploy --config wrangler.jsonc --dry-run

      - name: Deploy Worker code and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Deploying Worker gudangai-rudy-live69 (code + assets)..."
          npx wrangler@4.156.0 deploy --config wrangler.jsonc

      - name: Apply Worker secrets (non-interactive, durable)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GUDANGAI_SHEETS_API_SECRET: ${{ secrets.GUDANGAI_SHEETS_API_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Refusing to set empty secret: $name"
              exit 1
            fi
            echo "Setting secret: $name"
            printf '%s' "$value" | npx wrangler@4.156.0 secret put "$name" --config wrangler.jsonc
          }
          put_secret "SUPABASE_URL" "$SUPABASE_URL"
          put_secret "SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY"
          put_secret "GUDANGAI_SHEETS_API_SECRET" "$GUDANGAI_SHEETS_API_SECRET"
          echo "Worker secrets applied successfully."

      - name: Report deployed commit
        run: |
          echo "Cloudflare production deployment completed for commit ${GITHUB_SHA}"
          echo "Worker: gudangai-rudy-live69"
          echo "URL: https://gudangai-rudy-live69.rudivirawan69.workers.dev/"
