name: Deploy GudangAI RUDY PWA to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feature/worker-ai-cost-safe-hardening-20261104
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test Agent Worker security and provider routing
        run: npm run test:agent

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Build production PWA
        run: npm run build
        env:
          CLOUDFLARE_WORKERS: "true"

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare deployment secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY. Agent deployment blocked to avoid an unauthenticated endpoint."
            exit 1
          fi

      - name: Validate Cloudflare Worker config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.156.0 deploy --config wrangler.jsonc --dry-run

      - name: Configure Supabase Auth verification secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$SUPABASE_URL" | npx wrangler@4.156.0 secret put SUPABASE_URL --config wrangler.jsonc
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler@4.156.0 secret put SUPABASE_ANON_KEY --config wrangler.jsonc

      - name: Deploy to requested Cloudflare Worker domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.156.0 deploy --config wrangler.jsonc

      - name: Report deployed commit
        run: |
          echo "Cloudflare production deployment requested for commit ${GITHUB_SHA}"
          echo "Worker: gudangai-rudy"
          echo "URL: https://gudangai-rudy.rudivirawan69.workers.dev/"