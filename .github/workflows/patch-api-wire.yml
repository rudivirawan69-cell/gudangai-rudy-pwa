name: patch-api-wire
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unsupported clientItemId from bulk wire payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/data/api.js")
          s = p.read_text()
          old = "    nonce: 'NC-' + String(it.clientItemId),\n    clientItemId: String(it.clientItemId),\n"
          new = "    nonce: 'NC-' + String(it.clientItemId),\n"
          if old not in s:
              raise SystemExit("TARGET_NOT_FOUND")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/api.js .github/workflows/patch-api-wire.yml
          git rm .github/workflows/patch-api-wire.yml
          git commit -m "fix(api): remove unsupported clientItemId from bulk wire payload"
          git push origin main
