name: Surgical API Wire Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(api): remove unsupported bulk wire fields') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unsupported bulk wire fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/data/api.js")
          s = p.read_text(encoding="utf-8")

          old = """  const wire = normalized.map((it) => ({
    kodeBarang: String(it.kode || '').trim(),
    kode: String(it.kode || '').trim(),
    qty: Number(it.qty) || 0,
    keterangan: String(it.keterangan || '').trim().slice(0, 200),
    requestId: String(it.clientItemId),
    transactionId: 'TX-' + String(it.clientItemId),
    nonce: 'NC-' + String(it.clientItemId),
  }));"""

          new = """  const wire = normalized.map((it) => ({
    kodeBarang: String(it.kode || '').trim(),
    qty: Number(it.qty) || 0,
    keterangan: String(it.keterangan || '').trim().slice(0, 200),
    tanggal: normalizeTanggal(tanggal),
    requestId: String(it.clientItemId),
    transactionId: 'TX-' + String(it.clientItemId),
    nonce: 'NC-' + String(it.clientItemId),
  }));"""

          if old not in s:
              raise SystemExit("Expected bulk wire block not found; aborting without changes")

          s2 = s.replace(old, new, 1)
          if s2 == s:
              raise SystemExit("Patch produced no change")

          p.write_text(s2, encoding="utf-8")

          # Verify the exact wire block now contains only backend-allowed transaction fields.
          start = s2.index("  const wire = normalized.map")
          end = s2.index("  }));", start) + len("  }));")
          wire = s2[start:end]
          if "    kode:" in wire or "clientItemId:" in wire:
              raise SystemExit("Unsupported field still present in wire payload")
          for required in ["kodeBarang:", "qty:", "keterangan:", "tanggal:", "requestId:", "transactionId:", "nonce:"]:
              if required not in wire:
                  raise SystemExit(f"Missing required wire field: {required}")

          print("Verified: bulk wire payload is backend-whitelisted.")
          PY
          git diff --check
          git diff -- src/data/api.js

      - name: Commit surgical fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/api.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(api): remove unsupported bulk wire fields"
          git push
