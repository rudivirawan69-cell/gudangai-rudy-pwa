name: PR Agent Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/agent-manifest-deterministic-enumeration-20261126

permissions:
  contents: read

jobs:
  agent-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run agent regression tests
        run: npm run test:agent
      - name: Build production assets (no deployment)
        run: npm run build
