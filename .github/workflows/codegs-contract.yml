name: GudangAI Code.gs Contract

on:
  push:
    branches:
      - rebuild/codegs-v7-foundation
    paths:
      - "Code.gs"
      - "backend-rebuild/**"
      - ".github/workflows/codegs-contract.yml"
  pull_request:
    paths:
      - "Code.gs"
      - "backend-rebuild/**"
      - ".github/workflows/codegs-contract.yml"

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Code.gs syntax and safety contract
        run: node backend-rebuild/verify-codegs-contract.js
