name: Deploy GudangAI RUDY PWA to Cloudflare Pages

on:
  # Legacy Pages deploy is manual-only; production is the single Worker domain.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy-pages:
    name: Build and deploy Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production PWA
        run: npm run build

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare deployment secrets (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4.156.0 pages deploy dist \
            --project-name=gudangai-rudy-pwa \
            --branch=main \
            --commit-dirty=true

      - name: Report Pages deployment
        run: |
          echo "Cloudflare Pages deployment requested for commit ${GITHUB_SHA}"
          echo "Project: gudangai-rudy-pwa"
          echo "Expected URL patterns:"
          echo "  - https://gudangai-rudy-pwa.pages.dev"
          echo "  - https://main.gudangai-rudy-pwa.pages.dev"
