name: Agent Worker Tests

on:
  pull_request:
    paths:
      - "worker.js"
      - "scripts/test-agent-worker.mjs"
      - "package.json"
      - ".github/workflows/agent-worker-tests.yml"
  push:
    branches:
      - feature/agent-live-readonly-20261109

permissions:
  contents: read

jobs:
  agent-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Run Agent Worker tests
        run: npm run test:agent
