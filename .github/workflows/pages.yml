name: Deploy GudangAI RUDY to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload-pages-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Surgical API wire compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/data/api.js")
          s = p.read_text(encoding="utf-8")
          old = """  const wire = normalized.map((it) => ({
    kodeBarang: String(it.kode || '').trim(),
    kode: String(it.kode || '').trim(),
    qty: Number(it.qty) || 0,
    keterangan: String(it.keterangan || '').trim().slice(0, 200),
    requestId: String(it.clientItemId),
    transactionId: 'TX-' + String(it.clientItemId),
    nonce: 'NC-' + String(it.clientItemId),
  }));"""
          new = """  const wire = normalized.map((it) => ({
    kodeBarang: String(it.kode || '').trim(),
    qty: Number(it.qty) || 0,
    keterangan: String(it.keterangan || '').trim().slice(0, 200),
    tanggal: normalizeTanggal(tanggal),
    requestId: String(it.clientItemId),
    transactionId: 'TX-' + String(it.clientItemId),
    nonce: 'NC-' + String(it.clientItemId),
  }));"""
          if old not in s:
              raise SystemExit("Expected bulk wire block not found")
          s = s.replace(old, new, 1)
          start = s.index("  const wire = normalized.map")
          end = s.index("  }));", start) + len("  }));")
          wire = s[start:end]
          if "    kode:" in wire or "clientItemId:" in wire:
              raise SystemExit("Unsupported field remains in bulk wire payload")
          p.write_text(s, encoding="utf-8")
          print("Verified: bulk wire payload matches Code.gs whitelist.")
          PY
          git diff --check
          if git diff --quiet -- src/data/api.js; then
            echo "No API wire patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/api.js
          git commit -m "fix(api): remove unsupported bulk wire fields"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
