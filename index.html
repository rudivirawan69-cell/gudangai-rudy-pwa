<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#247ba8" />
    <script>
      (() => {
        const key = 'gudangai_theme';
        const aliases = {
          dark: 'deep_ocean', ocean: 'deep_ocean', navy: 'deep_ocean',
          warm: 'graphite_titanium', warm_productive: 'graphite_titanium',
          productive: 'graphite_titanium', teal: 'graphite_titanium',
          glass: 'graphite_titanium', graphite: 'graphite_titanium',
          light: 'soft_light', soft: 'soft_light'
        };
        let theme = 'soft_light';
        try {
          const stored = String(localStorage.getItem(key) || '').toLowerCase().trim();
          theme = aliases[stored] || (['soft_light','deep_ocean','graphite_titanium'].includes(stored) ? stored : 'soft_light');
        } catch (_) {}
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme === 'soft_light' ? 'light' : 'dark';
        const colors = { soft_light: '#247ba8', deep_ocean: '#35b9b0', graphite_titanium: '#d69a48' };
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', colors[theme]);
      })();
    </script>
    <meta name="description" content="GudangAI RUDY — Dashboard stok & operasional Cold Storage Nasi Goreng 69" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GudangAI RUDY" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>GudangAI RUDY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
